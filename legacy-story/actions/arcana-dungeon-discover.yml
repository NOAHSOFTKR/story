# Source: NOAHSOFTKR/story actions/arcana-dungeon-discover.yml (schema 2.2.1 → 2.3.0 변환)
# Chapter 3 시작. 던전 입구 벽돌 파괴 감지.
# MANUAL: 던전 입구 벽돌 블록 ID 미정. EVENT 무필터는 전 블록 파괴에 발동해서 금지.
# TODO: 입구 벽돌 확정 후 filters.block 지정 + type: EVENT 승격.
id: arcana-dungeon-discover
name: "[아르카나] 기괴한 진동"
enable: true
nextStory: arcana-first-battle
triggers:
  - id: dungeon-discover
    name: Dungeon discovery trigger
    enable: true
    type: MANUAL
    event: block_break
    description: 플레이어가 던전 입구(기괴한 문양의 벽돌)를 발견했을 때 발동
    filters:
      # TODO: 던전 입구 벽돌 ID (예: minecraft:deepslate_tiles)
      block: __todo_dungeon_brick__
    actions:
      message:
        id: message-main
        enable: true
        content: "&c[아르카나 - 조력자 바론] &f그 문을 열지 마라, 애송이! 겉보기엔 달콤한 냄새가 나겠지만, 저 안에는 &c빛에 굶주려 미쳐버린 끔찍한 장난감들&f이 득실거리니까."
        toSend: triggeredPlayer
      commandsEnable: true
      commands:
        - "title {player} subtitle {\"text\":\"기묘하고 늘어지는 오르골 소리가 들립니다...\",\"color\":\"red\"}"
        - "execute at {player} run particle minecraft:soul_fire_flame ~ ~ ~ 0.5 0.5 0.5 1 15 force"
        - "playsound minecraft:ambient.cave player {player} ~ ~ ~ 1 0.7"
