# Source: NOAHSOFTKR/story actions/arcana-memory-restore.yml (schema 2.2.1 → 2.3.0 변환)
# Chapter 4 시작. 기억 해독 퀘스트 완료 감지.
# Quest 1.1.1의 완료 이벤트를 ArcanaSignalBridge가 Story 이벤트로 전달한다.
id: arcana-memory-restore
name: "[아르카나] 기억의 해독"
enable: true
nextStory: arcana-luminite-equip
triggers:
  - id: memory-restore
    name: Memory restoration quest
    enable: true
    type: EVENT
    event: quests_quest_complete
    filters:
      quest: chapter3_decode_memory
    description: 플레이어가 기억 해독 퀘스트를 완료했을 때 발동
    actions:
      message-memory:
        id: message-memory
        enable: true
        content: "&5[아르카나 - 코델리아] &f이제 진실을 알았으니, 그 빛에 잡아먹히지 않고 다룰 자격이 생겼다. 놈들의 썩은 마법을 뚫으려면 순수한 루미네이트로 벼려낸 갑옷이 필요해."
        toSend: triggeredPlayer
      message-truth-reveal:
        id: message-reveal
        enable: true
        content: "&f[&c진실&f] 루미네이트는 단순한 광물이 아니야. 이 세계의 생명력 그 자체지. 촌장과 감시자들이 이 생명력을 독점해 가짜 낙원을 유지하고 있었던 거야."
        toSend: triggeredPlayer
      commandsEnable: true
      commands:
        - "title {player} title {\"text\":\"기억의 해독 완료\",\"color\":\"light_purple\"}"
        # JSON 안의 &k 는 색코드로 안 바뀌어 글자 그대로 보였다 → obfuscated 컴포넌트로 (2026-10-26)
        - "title {player} subtitle [{\"text\":\"지직거리던텍스트\",\"color\":\"aqua\",\"obfuscated\":true},{\"text\":\"가 해독되었습니다.\",\"color\":\"aqua\",\"obfuscated\":false}]"
        - "playsound minecraft:ui.toast.challenge_complete player {player} ~ ~ ~ 1 1"
