# Source: NOAHSOFTKR/story actions/arcana-world-saved.yml (schema 2.2.1 → 2.3.0 변환)
# 엔딩. 세계 구원 업적 달성 감지.
# MANUAL: custom_achievement_unlock 는 2.3.0 이벤트 키가 아님 (지원 목록에 없음).
# TODO: 업적 시스템 연동 시 실제 이벤트 키로 교체 + type: EVENT 승격.
#       당장은 /story trigger run arcana-world-saved world-saved 로 수동 발화.
# ⚠ give arcana:dragon_set_* — arcana: 네임스페이스 아이템이 서버에 없음. 해제 보류.
# Upstream 커맨드 수정: "execute at ... firework launch" 는 바닐라 문법이 아니라서
# execute at + summon 형태로 교체 (콘솔 실행이라 좌표 기준이 필요).
id: arcana-world-saved
name: "[아르카나] 새로운 시대의 시작"
enable: true
triggers:
  - id: world-saved
    name: World saved achievement
    enable: true
    type: MANUAL
    event: story_done
    description: 플레이어가 세계 구원 업적을 달성했을 때 발동
    actions:
      message-new-era:
        id: message-new-era
        enable: true
        content: "&a[아르카나] &f당신의 진정한 이름, &6{player}&f, 당신은 이 세계의 구원자입니다. 이제부터는 당신이 이 시대의 지도자입니다. 당신의 국가를 더욱 강하게, 더욱 아름답게 만들어 가세요."
        toSend: triggeredPlayer
      message-global:
        id: message-global
        enable: true
        content: "&a&l[축하합니다!] &f&l{player}&f가 이 세계를 구원했습니다! 새로운 시대가 시작되었습니다!"
        toSend: allPlayers
      commandsEnable: true
      commands:
        # TODO: arcana:dragon_set_* 4종 아이템 등록 후 해제
        # - "give {player} arcana:dragon_set_helm 1"
        # - "give {player} arcana:dragon_set_chestplate 1"
        # - "give {player} arcana:dragon_set_leggings 1"
        # - "give {player} arcana:dragon_set_boots 1"
        - "title {player} title {\"text\":\"축하합니다!\",\"color\":\"green\"}"
        - "title {player} subtitle {\"text\":\"새로운 시대를 이끌어 가세요.\",\"color\":\"blue\"}"
        - "execute at {player} run summon minecraft:firework_rocket ~ ~1 ~ {LifeTime:20}"
        - "playsound minecraft:entity.player.levelup player {player} ~ ~ ~ 1 1"
