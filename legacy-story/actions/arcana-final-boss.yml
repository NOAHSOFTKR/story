# Source: NOAHSOFTKR/story actions/arcana-final-boss.yml (schema 2.2.1 → 2.3.0 변환)
# Chapter 5 클라이맥스. 최종 보스 처치 → EVENT 확정.
# 몹 매핑: 서버 최종 보스 Anubis (MythicMobs 실존 ID).
# ⚠ 기획상 최종 보스는 '촌장'. Anubis ↔ 촌장 동일시 여부는 콘텐츠 결정 필요.
#   촌장 몹이 따로 생기면 filters.mob 만 교체하면 된다.
# ⚠ give arcana:dragon_core — arcana: 네임스페이스 아이템이 서버에 없음. 해제 보류.
id: arcana-final-boss
name: "[아르카나] 최종 결전"
enable: true
nextStory: arcana-world-saved
triggers:
  - id: final-boss
    name: Final boss defeated
    enable: true
    type: EVENT
    event: mythicmobs_mob_death
    description: 플레이어가 최종 보스(촌장)를 처치했을 때 발동
    filters:
      mob: Anubis
    actions:
      message-victory:
        id: message-victory
        enable: true
        content: "&6&l[아르카나] &f거짓의 평화가 무너졌다... 이 세계의 진짜 수호신 드래곤의 영혼이 풀려납니다."
        toSend: triggeredPlayer
      message-announce:
        id: message-announce
        enable: true
        content: "&6&l[아르카나] &f&l{player}&f와 그의 국가가 타락한 촌장을 무찌르고 세계를 구원했습니다! 새로운 시대가 밝았습니다!"
        toSend: allPlayers
      commandsEnable: true
      commands:
        # TODO: arcana:dragon_core 아이템 등록 후 해제
        # - "give {player} arcana:dragon_core 1"
        - "title {player} title {\"text\":\"최종 승리!\",\"color\":\"gold\"}"
        - "title {player} subtitle {\"text\":\"당신은 세계의 구원자입니다.\",\"color\":\"light_purple\"}"
        - "execute at {player} run particle minecraft:end_rod ~ ~ ~ 1 1 1 2 50 force"
        - "playsound minecraft:entity.ender_dragon.death player {player} ~ ~ ~ 1 1"
