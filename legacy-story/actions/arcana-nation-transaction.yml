# Source: NOAHSOFTKR/story actions/arcana-nation-transaction.yml (schema 2.2.1 → 2.3.0 변환)
# 단독 파일 (nextStory null). 국가 세금/거래 flavor 메시지. EVENT 유지 (원본 설계).
# ※ 발동 빈도 높음. 스팸으로 느껴지면 enable: false 또는 MANUAL 전환.
id: arcana-nation-transaction
name: "[아르카나] 연맹의 재정"
enable: true
triggers:
  - id: nation-transaction
    name: Nation tax/transaction
    enable: true
    type: EVENT
    event: towny_nation_transaction
    description: 국가의 세금이나 거래가 발생했을 때 발동
    actions:
      message:
        id: message-tax
        enable: true
        content: "&6[아르카나] &f연맹의 자금이 변동했습니다. 국가의 번영은 모든 주민의 힘으로부터 비롯됩니다."
        toSend: triggeredPlayer
      commandsEnable: false
