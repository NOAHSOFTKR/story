name: Minecraft Plugin Release

on:
  push:
    tags:
      - 'v*' # 태그가 v1.0.0, v1.2-SNAPSHOT 등 v로 시작하면 실행

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Java 설정 (플러그인이 지원하는 대상 버전에 맞추세요. 예: 17 또는 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 2. Maven 빌드 (cutthin 의존성은 legacy-story/pom.xml이 libs/ 로컬 저장소에서 직접 해석한다)
      - name: Build Plugins
        run: mvn -B clean verify
        env:
          ARCANASTORY_REQUIRE_DOCKER: 'true'

      # 3. GitHub Release 생성 및 두 플러그인 jar 업로드 (shade의 original-*.jar는 패턴에서 제외된다)
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            legacy-story/target/story-*.jar
            arcana-story/target/ArcanaStory-*.jar
          # 태그 메시지나 커밋 로그를 기반으로 본문을 자동 생성하고 싶을 때 유용
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
