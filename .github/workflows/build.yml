name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # legacy-story, arcana-story 두 모듈을 모두 컴파일·테스트·패키징한다.
      - name: Verify all modules
        run: mvn -B verify
